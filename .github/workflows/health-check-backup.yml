name: health-check-backup

# สำรองจาก cron-job.org — ยิงเวลาเยื้องกัน 1 ชม. กันชนกันเป๊ะ
# cron-job.org:  01:00 / 07:00 / 13:00 / 19:00 UTC = 08:00 / 14:00 / 20:00 / 02:00 ICT
# GitHub Actions: 02:00 / 08:00 / 14:00 / 20:00 UTC = 09:00 / 15:00 / 21:00 / 03:00 ICT  (+1 ชม.)
on:
  schedule:
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Call health-check endpoint
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/health-check?mode=silent" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -o response.json
          cat response.json

      - name: Checkout (สำหรับ heartbeat commit)
        uses: actions/checkout@v4

      - name: Heartbeat commit
        # GitHub ปิด scheduled workflow อัตโนมัติถ้า repo ไม่มี commit ใน 60 วัน
        # commit ไฟล์เล็กๆ นี้ทุกครั้งที่รัน กันไม่ให้โดนปิด
        run: |
          mkdir -p .github/heartbeat
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat/last-run.txt
          git config user.name "health-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/heartbeat/last-run.txt
          git diff --staged --quiet || git commit -m "chore: heartbeat $(date -u +%Y-%m-%d)"
          git push
